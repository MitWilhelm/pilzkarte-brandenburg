# Holt eine echte Open-Meteo-Antwort als Testdatei (web/test/fixtures), weil Claudes Umgebung
# Open-Meteo nicht erreicht. Manuell oder bei Änderung dieser Datei auf dem Branch webseite.
name: Wetter-Probe

on:
  push:
    branches: [webseite]
    paths: [.github/workflows/wetter-probe.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open-Meteo abfragen
        run: |
          curl -sS --fail "https://api.open-meteo.com/v1/forecast?latitude=52.979&longitude=13.745&hourly=soil_temperature_6cm,soil_moisture_3_to_9cm&daily=precipitation_sum,temperature_2m_min&past_days=14&forecast_days=8&timezone=Europe%2FBerlin" \
            -o web/test/fixtures/openmeteo_joachimsthal.json
          head -c 600 web/test/fixtures/openmeteo_joachimsthal.json
      - name: Ergebnis zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add web/test/fixtures/openmeteo_joachimsthal.json
          git commit -m "Wetter-Probe: echte Open-Meteo-Antwort als Testdatei"
          git push
