# Baut die Webseite (web/) und veröffentlicht sie auf GitHub Pages.
# Prüft vorher Typen, Lint und Tests – eine fehlerhafte Version wird nicht veröffentlicht.
# Täglich morgens neu, damit tageswerte.json (Brennpunkte mit Wetter, Tipps) aktuell ist.
name: Webseite veröffentlichen

on:
  push:
    branches: [webseite, main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:
  schedule:
    # 04:00 UTC = 06:00 Sommerzeit / 05:00 Winterzeit. GitHub startet geplante Läufe oft einige Minuten später.
    - cron: "0 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build
      # Fällt Open-Meteo aus, wird trotzdem veröffentlicht; die Seite bewertet die Brennpunkte dann live.
      - name: Tageswerte (Brennpunkte mit Wetter) vorberechnen
        run: node scripts/tageswerte.ts dist/daten/barnim/tageswerte.json
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
