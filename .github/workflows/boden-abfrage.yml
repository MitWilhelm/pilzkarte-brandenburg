# Fragt die Bodenwerte der Standortskarte beim Landesbetrieb Forst ab.
# Läuft auf GitHub, weil der LFB-Server von Claudes Arbeitsumgebung aus nicht erreichbar ist.
# Ergebnis wird als daten/stok_antworten.jsonl in denselben Branch zurückgeschrieben.
name: Boden-Abfrage

on:
  push:
    branches: [boden-abfrage]
    paths:
      - pipeline/io_stok_abfrage.py
      - .github/workflows/boden-abfrage.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  abfrage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mini-Test: 3 Punkte, alle Antwortformate. Für den vollen Lauf werden die Optionen entfernt.
      - run: python -m pipeline.io_stok_abfrage --anzahl 3 --alle-formate
      - name: Ergebnis zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daten/stok_antworten.jsonl
          git commit -m "Boden-Abfrage: Antworten des LFB-Kartendienstes"
          git push
