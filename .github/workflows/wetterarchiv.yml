# Holt historisches Wetter (Open-Meteo Historical Forecast API) für die Fundorte, um alten und neuen
# Wachstumsindex an echten Funddaten zu vergleichen. Läuft auf GitHub, weil der Archiv-Host aus Claudes
# Umgebung gesperrt ist. Open-Meteo: < 10.000 Abrufe/Tag, nicht-kommerziell; hier 7 Abrufe mit 2 s Pause.
name: Wetterarchiv

on:
  push:
    branches: [claude/cool-hamilton-x8pj44]
    paths:
      - .github/workflows/wetterarchiv.yml

permissions:
  contents: write

jobs:
  archiv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Wetter je Fundort und Jahr holen
        run: |
          mkdir -p daten/wetterarchiv
          while read breite laenge jahr ende; do
            curl -sS --fail -m 60 -o "daten/wetterarchiv/${breite}_${laenge}_${jahr}.json" \
              "https://historical-forecast-api.open-meteo.com/v1/forecast?latitude=${breite}&longitude=${laenge}&start_date=${jahr}-05-01&end_date=${ende}&hourly=soil_temperature_6cm,soil_moisture_3_to_9cm&daily=precipitation_sum,temperature_2m_min,temperature_2m_mean&timezone=Europe%2FBerlin"
            sleep 2
          done <<'LISTE'
          52.79 13.73 2025 2025-11-15
          52.82 13.74 2025 2025-11-15
          52.79 13.74 2024 2024-11-15
          52.82 13.69 2024 2024-11-15
          52.82 13.68 2024 2024-11-15
          52.79 13.68 2024 2024-11-15
          53.00 13.72 2026 2026-10-03
          LISTE
          ls -la daten/wetterarchiv
      - name: Ergebnis zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daten/wetterarchiv
          git commit -m "Wetterarchiv: historisches Wetter an Fundorten" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
