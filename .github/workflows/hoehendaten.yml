# Lädt LGB-Höhendaten (bDOM, DGM) für die Testgebiete und berechnet daten/<gebiet>_struktur.tif (10 m).
# Läuft auf GitHub, weil der LGB-Server aus Claudes Umgebung nur sehr langsam liefert (~12 KB/s).
# Etwa 2 x 64 Kacheln à ~40 MB; jede Kachel wird nach der Verarbeitung gelöscht.
name: Hoehendaten

on:
  push:
    branches: [claude/cool-hamilton-x8pj44]
    paths:
      - pipeline/io_hoehe.py
      - .github/workflows/hoehendaten.yml

permissions:
  contents: write

jobs:
  struktur:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "rasterio>=1.4" "numpy>=1.26"
      - run: python -m pipeline.io_hoehe
      - name: Ergebnis zurückschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add daten/*_struktur.tif
          git commit -m "Hoehendaten: Kronenhoehe, Kronenschluss und Gelaende der Testgebiete (10 m)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
